<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK Admin — Essays</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }

/* ── Auth gate ── */
#auth-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
.auth-card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    padding: 3rem; text-align: center; width: 340px;
}
.auth-card h1 { font-size: 0.75rem; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 2rem; }
.auth-card input {
    width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; padding: 0.9rem 1rem; font-size: 0.85rem; letter-spacing: 2px;
    text-align: center; margin-bottom: 1rem; outline: none;
}
.auth-card input:focus { border-color: rgba(255,255,255,0.4); }
.auth-card button {
    width: 100%; background: #fff; color: #000; border: none;
    padding: 0.9rem; font-size: 0.75rem; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; cursor: pointer;
}
.auth-card button:hover { background: #FFDD66; }
#auth-error { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: #ff3aab; margin-top: 0.8rem; }

/* ── Layout ── */
#app { display: none; height: 100vh; flex-direction: column; }
#app.visible { display: flex; }
.top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.07); flex-shrink: 0;
}
.top-bar h1 { font-size: 0.7rem; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.35); }
.top-bar .actions { display: flex; gap: 0.75rem; align-items: center; }
.top-bar a { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.35); text-decoration: none; }
.top-bar a:hover { color: #FFDD66; }
.btn-save {
    background: #FFDD66; color: #000; border: none; padding: 0.55rem 1.4rem;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
}
.btn-save:hover { background: #ffe985; }
.btn-save:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: default; }
.save-status { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); }

.main { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 250px; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.07); overflow-y: auto; padding: 1rem 0; }
.sidebar-section { padding: 0.5rem 1.2rem; font-size: 0.55rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.2); margin-bottom: 0.25rem; }
.essay-item {
    display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 1.2rem; cursor: pointer;
    border-left: 2px solid transparent; transition: all 0.15s;
}
.essay-item:hover { background: rgba(255,255,255,0.04); }
.essay-item.active { border-left-color: #FFDD66; background: rgba(255,221,102,0.06); }
.essay-item.unpublished { opacity: 0.4; }
.essay-name { flex: 1; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; line-height: 1.4; }
.essay-slug { display: block; font-weight: 400; font-size: 0.6rem; letter-spacing: 1px; color: rgba(255,255,255,0.3); margin-top: 2px; }
.toggle-btn { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.3); font-size: 0.9rem; padding: 0 0.2rem; line-height: 1; }
.toggle-btn:hover { color: #fff; }

.content { flex: 1; overflow-y: auto; padding: 1.5rem 2rem 5rem; }
.essay-header { margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.07); }
.essay-header h2 { font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 0.35rem; }
.essay-header .meta { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); }
.essay-header .meta a { color: #FFDD66; text-decoration: none; }

/* ── Scene cards ── */
.scene {
    display: grid; grid-template-columns: 320px 1fr; gap: 1.25rem;
    padding: 1.1rem 0; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.scene-kind { font-size: 0.55rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #FFDD66; margin-bottom: 0.5rem; }
.scene-text { font-size: 0.8rem; line-height: 1.6; color: rgba(255,255,255,0.65); max-height: 190px; overflow-y: auto; }
.scene-text .heading { display: block; font-weight: 700; letter-spacing: 1px; color: #fff; text-transform: uppercase; margin-bottom: 0.5rem; font-size: 0.75rem; }
.scene-text p { margin-bottom: 0.5rem; }
.scene-text em { color: #FFDD66; }

/* Eye-frame editor: click the subject to set the focal point */
.img-wrap { position: relative; width: 100%; background: #000; overflow: hidden; cursor: crosshair; user-select: none; }
.img-wrap img { display: block; width: 100%; height: auto; pointer-events: none; }
.img-empty { display: flex; align-items: center; justify-content: center; height: 160px; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.25); border: 1px dashed rgba(255,255,255,0.15); }
.focal-dot {
    position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px;
    border: 2px solid #FFDD66; border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.6), 0 0 12px rgba(255,221,102,0.6); pointer-events: none;
}
.focal-dot::before, .focal-dot::after { content: ''; position: absolute; background: #FFDD66; }
.focal-dot::before { left: 50%; top: 3px; bottom: 3px; width: 1px; margin-left: -0.5px; }
.focal-dot::after { top: 50%; left: 3px; right: 3px; height: 1px; margin-top: -0.5px; }

.preview-row { display: flex; gap: 0.5rem; align-items: flex-end; padding: 0.5rem 0 0.35rem; }
.preview-box { background: #000; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
.preview-box.phone { width: 46px; height: 100px; }
.preview-box.desktop { width: 120px; height: 68px; }
.preview-box img { width: 100%; height: 100%; object-fit: cover; }
.preview-cap { font-size: 0.5rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.25); }

.field-row { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.5rem; flex-wrap: wrap; }
.field-row label { font-size: 0.55rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); }
.field-row input[type=text] {
    flex: 1; min-width: 120px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    color: #fff; padding: 0.4rem 0.5rem; font-size: 0.72rem; outline: none; font-family: inherit;
}
.field-row input[type=number] {
    width: 58px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    color: #fff; padding: 0.3rem 0.4rem; font-size: 0.7rem; outline: none;
}
.field-row input:focus { border-color: rgba(255,221,102,0.5); }

/* Photo swap strip */
.strip { display: flex; gap: 5px; overflow-x: auto; padding: 0.5rem 0 0.2rem; }
.strip img {
    width: 62px; height: 42px; object-fit: cover; cursor: pointer; flex: none;
    border: 2px solid transparent; opacity: 0.5; transition: all 0.15s;
}
.strip img:hover { opacity: 1; }
.strip img.current { border-color: #FFDD66; opacity: 1; }
/* Folder picker — lets a scene pull from anywhere in photos_web, not just
   the essay's own folder. Timeline pages draw on many cities at once. */
.folder-row { display: flex; align-items: center; gap: 0.5rem; padding-top: 0.5rem; }
.folder-row label { font-size: 0.55rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); }
.folder-row select {
    flex: 1; background: #111; color: #fff; border: 1px solid rgba(255,255,255,0.15);
    padding: 0.35rem 0.5rem; font-size: 0.7rem; font-family: inherit;
}
/* Dictation notes. These ride along in the JSON so Claude can read them
   straight out of the repo and action them. */
.note-wrap { padding-top: 0.9rem; }
.note-wrap label {
    display: block; font-size: 0.55rem; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: #FFDD66; margin-bottom: 0.4rem;
}
.note-wrap textarea {
    width: 100%; min-height: 72px; resize: vertical; background: #14130f;
    border: 1px solid rgba(255,221,102,0.28); color: #fff; padding: 0.6rem 0.7rem;
    font-family: inherit; font-size: 0.82rem; line-height: 1.5; outline: none;
}
.note-wrap textarea:focus { border-color: #FFDD66; }
.note-wrap textarea.has-note { background: #1b1809; }
.note-count {
    font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase;
    color: #FFDD66; margin-left: 0.5rem;
}
.empty-state { padding: 3rem; text-align: center; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.25); line-height: 2; }

/* Laptops and split-screen windows: stack the photo over its text preview
   rather than letting the two columns squeeze each other. */
@media (max-width: 1000px) {
    .scene { grid-template-columns: 1fr; gap: 0.6rem; }
    .sidebar { width: 190px; }
    .content { padding: 1.25rem 1rem 4rem; }
    .scene-text { max-height: 130px; }
}
</style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <h1>Essays</h1>
        <input type="password" id="pw-input" placeholder="PASSWORD" autofocus>
        <button id="pw-btn">Enter</button>
        <div id="auth-error"></div>
    </div>
</div>

<div id="app">
    <div class="top-bar">
        <h1>Photo Essays</h1>
        <div class="actions">
            <a href="/admin/">Flipbook →</a>
            <span class="save-status" id="save-status"></span>
            <button class="btn-save" id="save-btn" disabled>Save + Deploy</button>
        </div>
    </div>
    <div class="main">
        <div class="sidebar">
            <div class="sidebar-section">Essays</div>
            <div id="essay-list"></div>
        </div>
        <div class="content" id="content"></div>
    </div>
</div>

<script>
const API = '/.netlify/functions/admin';
let password = '';
let index = null;              /* content/essays/index.json */
let indexSha = null;
let essays = {};               /* slug -> { data, sha, dirty } */
let activeSlug = null;
let indexDirty = false;
let photoManifest = {};        /* content/photos.json — folder -> filenames */

/* ── Auth ─────────────────────────────────────────────────────────── */
document.getElementById('pw-btn').addEventListener('click', tryAuth);
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') tryAuth(); });

async function tryAuth() {
    const pw = document.getElementById('pw-input').value;
    const errEl = document.getElementById('auth-error');
    errEl.textContent = '';
    const res = await fetch(`${API}?action=auth`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
    });
    if (res.ok) {
        password = pw;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app').classList.add('visible');
        await loadAll();
    } else {
        errEl.textContent = 'Wrong password';
    }
}

/* ── Load ─────────────────────────────────────────────────────────── */
async function readFile(path) {
    const res = await fetch(`${API}?action=read`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, path })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'read failed');
    return data;
}

async function loadAll() {
    setStatus('Loading…');
    try {
        const idx = await readFile('content/essays/index.json');
        index = JSON.parse(idx.content);
        indexSha = idx.sha;
        /* Served as a static file — it's read-only here, so it doesn't
           need to go through the GitHub-backed read action. */
        try {
            const pm = await fetch('/content/photos.json', { cache: 'no-cache' });
            if (pm.ok) photoManifest = await pm.json();
        } catch (err) {
            /* Picker just falls back to the essay's own folder. */
        }
        for (const entry of index.essays) {
            const f = await readFile(`content/essays/${entry.slug}.json`);
            if (f.content) essays[entry.slug] = { data: JSON.parse(f.content), sha: f.sha, dirty: false };
        }
        renderSidebar();
        const first = index.essays.find(e => essays[e.slug]);
        if (first) selectEssay(first.slug);
        setStatus('');
    } catch (err) {
        setStatus('Load failed: ' + err.message);
    }
}

/* ── Sidebar ──────────────────────────────────────────────────────── */
function renderSidebar() {
    const list = document.getElementById('essay-list');
    list.innerHTML = '';
    index.essays.forEach(entry => {
        const e = essays[entry.slug];
        const published = e ? e.data.published !== false : entry.published !== false;
        const item = document.createElement('div');
        item.className = 'essay-item' + (published ? '' : ' unpublished') + (activeSlug === entry.slug ? ' active' : '');
        item.innerHTML = `
            <span class="essay-name">${entry.title || entry.slug}
                <span class="essay-slug">/${entry.slug}</span></span>
            <button class="toggle-btn" title="${published ? 'Published — click to hide' : 'Hidden — click to publish'}">${published ? '●' : '○'}</button>`;
        item.addEventListener('click', ev => { if (!ev.target.closest('.toggle-btn')) selectEssay(entry.slug); });
        item.querySelector('.toggle-btn').addEventListener('click', ev => {
            ev.stopPropagation();
            togglePublished(entry.slug);
        });
        list.appendChild(item);
    });
}

function togglePublished(slug) {
    const e = essays[slug];
    if (!e) return;
    e.data.published = e.data.published === false;
    e.dirty = true;
    const entry = index.essays.find(x => x.slug === slug);
    if (entry) entry.published = e.data.published;
    indexDirty = true;
    markDirty();
    renderSidebar();
}

/* ── Scene editor ─────────────────────────────────────────────────── */
function selectEssay(slug) {
    activeSlug = slug;
    renderSidebar();
    renderEssay(slug);
}

function textPreview(scene, kind) {
    if (kind === 'Cover') return '<p><em>Title screen — the first thing readers see.</em></p>';
    if (kind === 'End Card') return `<p><em>${scene.title || ''}</em></p>`;
    const heading = scene.heading ? `<span class="heading">${scene.heading}</span>` : '';
    const paras = (scene.blocks || []).flat().slice(0, 6).map(p => `<p>${p}</p>`).join('');
    return heading + paras;
}

function renderEssay(slug) {
    const { data } = essays[slug];
    const content = document.getElementById('content');
    const dir = '/' + data.photoDir.replace(/^\//, '');

    content.innerHTML = `
        <div class="essay-header">
            <h2>${data.title}</h2>
            <div class="meta">${data.chapters.length} chapters ·
                ${data.chapters.reduce((n, c) => n + (c.blocks || []).length, 0)} text cards ·
                ${(data.photos || []).length} photos ·
                <a href="/${slug}/" target="_blank">view live →</a>
                ${(() => {
                    const n = [data.cover, ...data.chapters, data.end]
                        .filter(s => s && s.note && s.note.trim()).length;
                    return n ? `<span class="note-count">${n} note${n > 1 ? 's' : ''} for Claude</span>` : '';
                })()}</div>
        </div>
        <div id="scenes"></div>`;

    const scenes = document.getElementById('scenes');
    const all = [
        { kind: 'Cover', obj: data.cover },
        ...data.chapters.map((c, i) => ({ kind: `Chapter ${i + 1}`, obj: c })),
        { kind: 'End Card', obj: data.end }
    ];

    all.forEach(({ kind, obj }) => scenes.appendChild(sceneCard(kind, obj, data, dir)));
}

function sceneCard(kind, obj, data, dir) {
    const pos = obj.pos || '50% 50%';
    const [px, py] = pos.split(' ').map(parseFloat);
    const isChapter = kind.startsWith('Chapter');

    const card = document.createElement('div');
    card.className = 'scene';
    card.innerHTML = `
        <div>
            <div class="scene-kind">${kind}${obj.img ? '' : ' — no photo'}</div>
            ${obj.img
                ? `<div class="img-wrap" title="Click the subject to set the focal point">
                       <img src="${dir}/${obj.img}" alt="">
                       <div class="focal-dot" style="left:${px}%; top:${py}%"></div>
                   </div>
                   <div class="preview-row">
                       <div class="preview-box phone"><img src="${dir}/${obj.img}" style="object-position:${pos}" alt=""></div>
                       <div class="preview-box desktop"><img src="${dir}/${obj.img}" style="object-position:${pos}" alt=""></div>
                       <span class="preview-cap">Phone / Desktop</span>
                   </div>`
                : '<div class="img-empty">Pick a photo below</div>'}
            <div class="field-row">
                <label>X</label><input type="number" class="x-input" value="${Math.round(px)}" min="0" max="100">
                <label>Y</label><input type="number" class="y-input" value="${Math.round(py)}" min="0" max="100">
            </div>
            <div class="folder-row">
                <label>Photos from</label>
                <select class="folder-select">
                    <option value="">This essay's folder</option>
                    ${Object.keys(photoManifest).sort().map(f =>
                        `<option value="${f}">${f} (${photoManifest[f].length})</option>`).join('')}
                </select>
            </div>
            <div class="strip"></div>
        </div>
        <div>
            ${isChapter ? `<div class="field-row"><label>Label</label><input type="text" class="label-input" value="${(obj.label || '').replace(/"/g, '&quot;')}" placeholder="shown top-right while reading"></div>` : ''}
            <div class="scene-text">${textPreview(obj, kind)}</div>
            <div class="note-wrap">
                <label>Note for Claude — say what you want changed here</label>
                <textarea class="note-input" placeholder="e.g. “swap this for a Lisbon shot, rewrite the copy to be funnier, cut the last line”">${(obj.note || '').replace(/</g, '&lt;')}</textarea>
            </div>
        </div>`;

    /* Focal point: click/drag on the photo, or type exact numbers. */
    const wrap = card.querySelector('.img-wrap');
    const dot = card.querySelector('.focal-dot');
    const previews = card.querySelectorAll('.preview-box img');
    const xInput = card.querySelector('.x-input');
    const yInput = card.querySelector('.y-input');

    function applyFocal(nx, ny) {
        nx = Math.max(0, Math.min(100, nx));
        ny = Math.max(0, Math.min(100, ny));
        const posStr = `${Math.round(nx)}% ${Math.round(ny)}%`;
        if (dot) { dot.style.left = `${nx}%`; dot.style.top = `${ny}%`; }
        previews.forEach(im => { im.style.objectPosition = posStr; });
        xInput.value = Math.round(nx);
        yInput.value = Math.round(ny);
        obj.pos = posStr;
        markEssayDirty();
    }

    if (wrap) {
        const pointToFocal = e => {
            const r = wrap.getBoundingClientRect();
            applyFocal(((e.clientX - r.left) / r.width) * 100, ((e.clientY - r.top) / r.height) * 100);
        };
        let dragging = false;
        wrap.addEventListener('mousedown', e => { dragging = true; pointToFocal(e); e.preventDefault(); });
        window.addEventListener('mousemove', e => { if (dragging) pointToFocal(e); });
        window.addEventListener('mouseup', () => { dragging = false; });
    }
    xInput.addEventListener('change', () => applyFocal(parseFloat(xInput.value), parseFloat(yInput.value)));
    yInput.addEventListener('change', () => applyFocal(parseFloat(xInput.value), parseFloat(yInput.value)));

    const labelInput = card.querySelector('.label-input');
    if (labelInput) labelInput.addEventListener('input', () => { obj.label = labelInput.value; markEssayDirty(); });

    const noteInput = card.querySelector('.note-input');
    if (noteInput) {
        const syncNoteStyle = () => noteInput.classList.toggle('has-note', !!noteInput.value.trim());
        syncNoteStyle();
        noteInput.addEventListener('input', () => {
            const v = noteInput.value.trim();
            if (v) obj.note = noteInput.value; else delete obj.note;
            syncNoteStyle();
            markEssayDirty();
        });
    }

    /* Photo picker. The essay's own photos come first; the folder select
       opens the rest of photos_web for scenes that pull from anywhere. */
    const strip = card.querySelector('.strip');
    const folderSel = card.querySelector('.folder-select');

    /* prefix is the repo-relative folder, e.g. "photos_web/05_PARIS_FR".
       Stored values keep that prefix so essay.js treats them as paths
       rather than names inside the essay's own photoDir. */
    function fillStrip(names, prefix) {
        strip.innerHTML = '';
        names.forEach(name => {
            const value = prefix ? `${prefix}/${name}` : name;
            const t = document.createElement('img');
            t.src = prefix ? `/${value}` : `${dir}/${name}`;
            t.loading = 'lazy';
            t.alt = name;
            t.title = value;
            if (value === obj.img) t.className = 'current';
            t.addEventListener('click', () => {
                obj.img = value;
                markEssayDirty();
                renderEssay(activeSlug);
            });
            strip.appendChild(t);
        });
    }

    if (folderSel) {
        /* Default the picker to the folder the current photo lives in. */
        const current = obj.img && obj.img.includes('/')
            ? obj.img.replace(/^photos_web\//, '').split('/').slice(0, -1).join('/')
            : '';
        folderSel.value = current;
        const refresh = () => {
            const f = folderSel.value;
            if (!f) fillStrip(data.photos || [], '');
            else fillStrip(photoManifest[f] || [], `photos_web/${f}`);
        };
        folderSel.addEventListener('change', refresh);
        refresh();
    } else {
        fillStrip(data.photos || [], '');
    }

    return card;
}

/* ── Save ─────────────────────────────────────────────────────────── */
function markEssayDirty() {
    if (essays[activeSlug]) essays[activeSlug].dirty = true;
    markDirty();
}
function markDirty() {
    document.getElementById('save-btn').disabled = false;
    setStatus('Unsaved changes');
}
function setStatus(msg) { document.getElementById('save-status').textContent = msg; }

async function writeFile(path, content, sha, message) {
    const res = await fetch(`${API}?action=write`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, path, content, sha, message })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.githubMessage || data.error || 'write failed');
}

document.getElementById('save-btn').addEventListener('click', async () => {
    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    setStatus('Saving…');
    try {
        for (const [slug, e] of Object.entries(essays)) {
            if (!e.dirty) continue;
            await writeFile(`content/essays/${slug}.json`,
                JSON.stringify(e.data, null, 2) + '\n', e.sha,
                `admin: update essay “${e.data.title}”`);
        }
        if (indexDirty) {
            await writeFile('content/essays/index.json',
                JSON.stringify(index, null, 2) + '\n', indexSha,
                'admin: update essay index');
        }
        /* Re-read so the next save has fresh shas. */
        essays = {}; indexDirty = false;
        await loadAll();
        setStatus('Saved ✓ — deploying…');
        setTimeout(() => setStatus(''), 4000);
    } catch (err) {
        setStatus('Error: ' + err.message);
        btn.disabled = false;
    }
});
</script>
</body>
</html>
